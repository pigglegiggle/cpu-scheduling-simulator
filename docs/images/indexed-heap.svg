<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs><g font-family="Arial, Helvetica, sans-serif" fill="#111" stroke-width="1.5"><text x="600.0" y="40.4" font-size="24" text-anchor="middle">Indexed min-heap</text><text x="405.0" y="86.95" font-size="17" text-anchor="middle">Heap tree: example entries shown as ID / rank</text><polyline points="390,166 220,225" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="390,166 560,225" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="220,281 110,340" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="220,281 330,340" fill="none" stroke="#222" marker-end="url(#arrow)"/><polyline points="560,281 550,340" fill="none" stroke="#222" marker-end="url(#arrow)"/><rect x="310" y="110" width="160" height="56" fill="white" stroke="#222"/><text x="390.0" y="131.6" font-size="16" text-anchor="middle">index 0</text><text x="390.0" y="155.6" font-size="16" text-anchor="middle">40 / 5</text><rect x="140" y="225" width="160" height="56" fill="white" stroke="#222"/><text x="220.0" y="246.6" font-size="16" text-anchor="middle">index 1</text><text x="220.0" y="270.6" font-size="16" text-anchor="middle">20 / 12</text><rect x="480" y="225" width="160" height="56" fill="white" stroke="#222"/><text x="560.0" y="246.6" font-size="16" text-anchor="middle">index 2</text><text x="560.0" y="270.6" font-size="16" text-anchor="middle">60 / 8</text><rect x="30" y="340" width="160" height="56" fill="white" stroke="#222"/><text x="110.0" y="361.6" font-size="16" text-anchor="middle">index 3</text><text x="110.0" y="385.6" font-size="16" text-anchor="middle">10 / 32</text><rect x="250" y="340" width="160" height="56" fill="white" stroke="#222"/><text x="330.0" y="361.6" font-size="16" text-anchor="middle">index 4</text><text x="330.0" y="385.6" font-size="16" text-anchor="middle">50 / 24</text><rect x="470" y="340" width="160" height="56" fill="white" stroke="#222"/><text x="550.0" y="361.6" font-size="16" text-anchor="middle">index 5</text><text x="550.0" y="385.6" font-size="16" text-anchor="middle">30 / 16</text><text x="995.0" y="86.95" font-size="17" text-anchor="middle">ID-to-position map</text><rect x="875" y="110" width="240" height="48" fill="white" stroke="#222"/><text x="995.0" y="139.95" font-size="17" text-anchor="middle">40  →  0</text><rect x="875" y="158" width="240" height="48" fill="white" stroke="#222"/><text x="995.0" y="187.95" font-size="17" text-anchor="middle">20  →  1</text><rect x="875" y="206" width="240" height="48" fill="white" stroke="#222"/><text x="995.0" y="235.95" font-size="17" text-anchor="middle">60  →  2</text><rect x="875" y="254" width="240" height="48" fill="white" stroke="#222"/><text x="995.0" y="283.95" font-size="17" text-anchor="middle">10  →  3</text><rect x="875" y="302" width="240" height="48" fill="white" stroke="#222"/><text x="995.0" y="331.95" font-size="17" text-anchor="middle">50  →  4</text><rect x="875" y="350" width="240" height="48" fill="white" stroke="#222"/><text x="995.0" y="379.95" font-size="17" text-anchor="middle">30  →  5</text><text x="405.0" y="440.6" font-size="16" text-anchor="middle">Array indexes:   0      1      2      3      4      5</text><text x="405.0" y="471.6" font-size="16" text-anchor="middle">Entry IDs:          40    20    60    10    50    30</text><text x="600.0" y="517.95" font-size="17" text-anchor="middle">Peek O(1) / insert, update and erase O(log n) / each swap repairs both map entries</text></g></svg>
